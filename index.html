<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bone Up! Anatomy study lab</title>
<meta name="description" content="Learn every bone, bone marking and muscle fast with flashcards, quizzes and games.">
<meta name="theme-color" content="#ff4d6d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* every accent means something: bone = gold, muscle = red, nerve = teal, markings = violet, terms = blue */
  --bg:#eef3fa;--surface:#ffffff;--surface2:#e6edf7;--text:#1d1b3a;--muted:#5d6280;--line:#d9e2ef;
  --bone:#e0a823;--muscle:#ff4d6d;--nerve:#00a3a3;--mark:#7c4dff;--term:#2f80ed;
  --good:#12a150;--bad:#e5294b;
  --skBone:#f7ebd2;--skEdge:#a88c5c;--skHover:#ffd76e;--skBg:#dbe8fb;--skin:#f4d6c1;--skinEdge:#c99a7d;--mu1:#e5636f;--mu2:#cf4b5d;--mu3:#f08a8a;--muEdge:#8e2b3a;
  --shadow:0 2px 0 var(--line),0 10px 24px rgba(29,27,58,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12122a;--surface:#1d1d3d;--surface2:#28284f;--text:#f2f1ff;--muted:#a9abcf;--line:#33335e;
  --bone:#f2c14e;--muscle:#ff6b85;--nerve:#2fd0c8;--mark:#a586ff;--term:#62a3ff;--good:#2fcf72;--bad:#ff5c79;
  --skBone:#f1e3c4;--skEdge:#8a7650;--skHover:#ffd76e;--skBg:#232350;--skin:#d9b49c;--skinEdge:#9c7660;--mu1:#e5636f;--mu2:#c94458;--mu3:#ef8686;--muEdge:#6e1f2c;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12122a;--surface:#1d1d3d;--surface2:#28284f;--text:#f2f1ff;--muted:#a9abcf;--line:#33335e;
  --bone:#f2c14e;--muscle:#ff6b85;--nerve:#2fd0c8;--mark:#a586ff;--term:#62a3ff;--good:#2fcf72;--bad:#ff5c79;
  --skBone:#f1e3c4;--skEdge:#8a7650;--skHover:#ffd76e;--skBg:#232350;--skin:#d9b49c;--skinEdge:#9c7660;--mu1:#e5636f;--mu2:#c94458;--mu3:#ef8686;--muEdge:#6e1f2c;
  --shadow:0 2px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.btn,.chip,.num,.huge,.fname,.mn,.tile b{font-family:Fredoka,Nunito,system-ui,sans-serif}
h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.08;margin:.15em 0 .45em;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.2;margin:.2em 0 .5em;font-weight:600}
h3{font-size:1.08rem;margin:.2em 0 .4em;font-weight:600}
p{margin:.35em 0 .8em}
a{color:inherit}
:focus-visible{outline:3px solid var(--term);outline-offset:2px;border-radius:8px}
button{font:inherit}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.brand{font-weight:700;font-size:1.4rem;text-decoration:none;display:flex;align-items:center;gap:9px;margin-right:auto;letter-spacing:-.01em}
.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--bone);font-size:1.25rem;transform:rotate(-10deg);box-shadow:3px 3px 0 var(--muscle)}
.topnav{display:none;gap:4px}
.topnav a{text-decoration:none;font-weight:800;padding:8px 14px;border-radius:12px;color:var(--muted)}
.topnav a:hover{color:var(--text)}
.topnav a.on{background:var(--text);color:var(--bg)}
.iconbtn{border:2px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;font-size:1.1rem;cursor:pointer;color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;font-size:.72rem;font-weight:800;color:var(--muted);padding:5px 0;border-radius:14px}
.tabbar a span{font-size:1.35rem;line-height:1.1}
.tabbar a.on{color:var(--text);background:var(--surface2)}
@media(min-width:820px){.tabbar{display:none}.topnav{display:flex}main{padding:26px 24px 60px}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sb{justify-content:space-between}
.center{text-align:center;justify-content:center}
.sm{font-size:.88rem}.muted{color:var(--muted)}.lead{font-size:1.08rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:1rem;padding:10px 18px;border-radius:14px;text-decoration:none;cursor:pointer;min-height:46px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);box-shadow:0 3px 0 var(--muscle)}
.btn.big{width:100%;font-size:1.15rem;padding:14px;margin-top:16px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sm{font-family:Nunito,sans-serif;font-size:.78rem;font-weight:700;padding:2px 10px;border-width:1px;cursor:default;color:var(--muted)}
.chips.small{margin:10px 0 0;gap:6px}
.tag{display:inline-block;font-size:.8rem;font-weight:800;color:var(--accent,var(--mark));background:color-mix(in srgb,var(--accent,var(--mark)) 15%,transparent);padding:2px 10px;border-radius:999px;margin-bottom:8px}
.pill{display:inline-block;font-size:.75rem;font-weight:800;background:var(--surface2);color:var(--muted);padding:2px 9px;border-radius:999px;vertical-align:middle;font-family:Nunito,sans-serif}
.bar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent,var(--nerve));border-radius:999px;transition:width .4s}
.bar.thin{height:8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.sec{margin-top:30px}
.huge{font-size:3.2rem;line-height:1.1}
.empty{text-align:center}
.lbl{display:block;font-weight:800;margin:16px 0 8px}
select,input[type=search],input[type=date]{font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);min-height:46px;max-width:100%}

/* ---------- home ---------- */
.hero{display:grid;gap:18px;padding:22px;position:relative;overflow:hidden}
.hero h1{max-width:15ch}
.hero .bonestack{display:flex;gap:6px;margin:0 0 12px}
.hero .bonestack i{height:10px;border-radius:99px;display:block}
@media(min-width:720px){.hero{grid-template-columns:1fr 230px;align-items:center;padding:30px}}
.exam{background:var(--surface2);border-radius:18px;padding:16px;text-align:center}
.exam input{width:100%;margin:8px 0}
.num{font-size:3.8rem;font-weight:700;line-height:1;color:var(--muscle)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:1.55rem;font-weight:600}
.stat span{font-size:.82rem;color:var(--muted);font-weight:700}
.deck{text-decoration:none;display:block;border-left:8px solid var(--accent)}
.deck .emoji{font-size:1.8rem}.deck .pct{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.4rem;color:var(--accent)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:20px;text-decoration:none;color:var(--text);background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.tile .te{font-size:2rem;line-height:1.2}.tile b{font-size:1.15rem;font-weight:600}.tile .ts{font-size:.85rem;color:var(--muted)}

/* ---------- study guide ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--surface2);padding:4px;border-radius:14px}
.seg a{padding:7px 14px;border-radius:10px;text-decoration:none;font-weight:800;color:var(--muted)}
.seg a.on{background:var(--surface);color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--mark)}
.tally{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:4px 0 8px}
.tally div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 18px;text-align:center;font-weight:700;color:var(--muted)}
.tally b{display:block;font-family:Fredoka,sans-serif;font-size:1.9rem;color:var(--text);font-weight:600}
.tally .op{background:none;border:0;font-size:1.6rem;padding:0 2px}
.tally .tot b{color:var(--bone)}
.item{border-left:8px solid var(--accent)}
.item h2{font-size:1.2rem}
.oian{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;margin:8px 0;text-align:left}
.lab{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:800;font-size:.85rem}
.lab.o{background:var(--term)}.lab.i{background:var(--mark)}.lab.a{background:var(--muscle)}.lab.n{background:var(--nerve)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;font-weight:700;color:var(--muted);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:.92rem}
.mlist{margin:8px 0 0;padding-left:18px}.mlist li{margin:6px 0}
details.acc{margin-bottom:10px}
details.acc summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.05rem;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-family:Fredoka,sans-serif;font-size:1.4rem;color:var(--muted)}
details.acc[open] summary::after{content:"–"}

/* ---------- flashcards ---------- */
.flip{perspective:1400px;margin:12px auto;max-width:620px;transition:transform .22s,opacity .22s}
.flip.flyR{transform:translateX(55%) rotate(8deg);opacity:0}
.flip.flyL{transform:translateX(-55%) rotate(-8deg);opacity:0}
.fc{position:relative;height:min(58vh,440px);min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.35,.5,1);cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:28px 22px 34px;display:flex;flex-direction:column;overflow:auto;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
.face.front{justify-content:center;align-items:center;text-align:center;background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.face.back{transform:rotateY(180deg)}
.fname{font-size:clamp(1.8rem,7vw,2.7rem);font-weight:600;line-height:1.1;margin:0}
.big{font-size:1.12rem;font-weight:700}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}
.dots{position:absolute;top:16px;right:18px;display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;margin:8px auto}
.btn.again{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border-color:color-mix(in srgb,var(--bad) 45%,transparent);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 45%,transparent);font-size:1.1rem;min-height:56px}
.btn.got{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,transparent);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 45%,transparent);font-size:1.1rem;min-height:56px}

/* ---------- quiz / blitz ---------- */
.setup{max-width:680px;margin:0 auto}
.qcard{max-width:720px;margin:14px auto;border-top:8px solid var(--accent)}
.qsub{font-size:1.06rem;background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer;min-height:54px;box-shadow:0 3px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);font-weight:800;font-size:.85rem}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff;box-shadow:none}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:none;animation:shake .4s}
.opt.ok .key,.opt.no .key{background:rgba(255,255,255,.25)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.05rem}
.fb.good{background:color-mix(in srgb,var(--good) 15%,transparent)}
.fb.miss{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.explain{margin-top:10px;background:var(--surface2);border-radius:14px;padding:10px 14px}
.explain summary{cursor:pointer;font-weight:800}
.score{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem}
.done{text-align:center;max-width:620px;margin:10px auto}
.bigpct{font-family:Fredoka,sans-serif;font-size:2.6rem;font-weight:700;color:var(--mark)}
.hud{background:var(--surface);border-radius:16px;padding:10px 16px;border:2px solid var(--line);font-size:1.1rem}
.timer b{font-family:Fredoka,sans-serif;font-size:1.7rem;color:var(--muscle)}
.combo{font-weight:800;color:var(--bone);font-family:Fredoka,sans-serif;font-size:1.2rem}
.timebar i{transition:width .1s linear;background:var(--muscle)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:720px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mt{min-height:96px;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .15s,opacity .3s;overflow-wrap:anywhere}
.mt.L{font-family:Fredoka,sans-serif;font-weight:600;font-size:1rem;background:color-mix(in srgb,var(--term) 12%,var(--surface))}
.mt.sel{border-color:var(--bone);background:color-mix(in srgb,var(--bone) 30%,var(--surface));transform:translateY(-3px)}
.mt.done{background:var(--good);color:#fff;border-color:var(--good);opacity:.3;transform:scale(.94);cursor:default;box-shadow:none}
.mt.shake{animation:shake .4s;border-color:var(--bad)}
@media(max-width:400px){.mt{font-size:.8rem;min-height:84px;padding:8px}}

/* ---------- skeleton ---------- */
.maplay{display:grid;gap:16px}
@media(min-width:820px){.maplay{grid-template-columns:minmax(280px,430px) 1fr;align-items:start}.panel{position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}}
.skelwrap{padding:12px;background:var(--skBg)}
.skel{display:block;width:100%;height:auto;max-height:76vh;margin:0 auto;touch-action:manipulation}
.skel .bone{fill:var(--skBone);stroke:var(--skEdge);stroke-width:1.3;cursor:pointer;transition:fill .2s,stroke .2s}
.skel .ln{fill:none;stroke:var(--skBone);stroke-linecap:round}
.skel .rib{stroke-width:4.5}
.skel .bone:hover{fill:var(--skHover)}
.skel .ln:hover{stroke:var(--skHover)}
.skel .hit{fill:transparent;stroke:none;cursor:pointer}
.skel .decor{fill:var(--skBg);stroke:var(--skEdge);stroke-width:1;pointer-events:none}
.skel .bone.hl{fill:var(--bone)}
.skel .bone.ok{fill:var(--good)}
.skel .bone.bad{fill:var(--bad)}
.skel .ln.hl{stroke:var(--bone);fill:none}
.skel .ln.ok{stroke:var(--good);fill:none}
.skel .ln.bad{stroke:var(--bad);fill:none}
.find{font-size:1.7rem;line-height:1.15}
.find span{color:var(--muscle)}
.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}
.mini{padding:10px 0;border-bottom:2px dashed var(--line)}

/* ---------- weak spots / tricks ---------- */
.wlist{display:grid;gap:10px;margin-top:14px}
.wrow{padding:12px 16px;border-left:8px solid var(--accent)}
.wrow summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary b{flex:1}
.wrow[open] summary{margin-bottom:10px}
.trick{border-top:8px solid var(--accent)}
.trick .mn{font-size:1.3rem;font-weight:600;color:var(--accent);margin:4px 0 8px;line-height:1.2}

.dg .bn{fill:var(--skBone);stroke:var(--skEdge);stroke-width:1.6;stroke-linejoin:round}
.dg .bn2{fill:color-mix(in srgb,var(--skBone) 78%,var(--skEdge));stroke:var(--skEdge);stroke-width:1.2}
.dg .ln{fill:none;stroke:var(--skEdge);stroke-width:1.6;stroke-linecap:round}
.dg .dash{stroke-dasharray:4 4}
.dg .dc{fill:var(--skBg);stroke:var(--skEdge);stroke-width:1.4}
.dg .rough{fill:var(--skEdge);opacity:.35}
.dg .skin{fill:var(--skin);stroke:var(--skinEdge);stroke-width:1.4}
.dg .mu{fill:var(--mu1);stroke:var(--muEdge);stroke-width:1.2;stroke-linejoin:round}
.dg .mu2{fill:var(--mu2);stroke:var(--muEdge);stroke-width:1.2;stroke-linejoin:round}
.dg .mu3{fill:var(--mu3);stroke:var(--muEdge);stroke-width:1.2;stroke-linejoin:round}
.dg.skel .ln{stroke:var(--skBone);fill:none}
.stage{position:relative;margin:0 auto;background:var(--skBg);border-radius:18px;overflow:hidden;border:2px solid var(--line);width:100%}
.stage>svg,.stage>img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-select:none;user-select:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--bone);border:2.5px solid #1d1b3a;color:#1d1b3a;font:800 .74rem/1 Nunito,sans-serif;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.pin.sel{background:var(--term);color:#fff}
.pin.dot{min-width:12px;width:12px;height:12px;padding:0;border-width:2px;cursor:default}
.pin.active{min-width:18px;width:18px;height:18px;padding:0;background:var(--muscle);border:3px solid #fff;box-shadow:0 0 0 2.5px #1d1b3a,0 3px 10px rgba(0,0,0,.5);cursor:default}
.pin.active::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--muscle);animation:ping 1.5s ease-out infinite}
.pin.still::after{display:none}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
.plab{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--text);color:var(--bg);font:700 .78rem/1.3 Nunito,sans-serif;padding:3px 8px;border-radius:8px;pointer-events:none}
.plab.l{left:auto;right:calc(100% + 6px)}
.station{display:grid;gap:14px;margin-top:12px}
@media(min-width:820px){.station{grid-template-columns:1.15fr 1fr;align-items:start}}
.ans{width:100%;font:inherit;font-size:1.12rem;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.ans:focus{border-color:var(--term);outline:none}
.ans:disabled{opacity:.7}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:10px;align-items:start}
.st-ok{color:var(--good)}.st-close{color:var(--bone)}.st-miss{color:var(--bad)}
.thumbgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.thumbgrid .stage{max-width:100%!important}
.optl{cursor:pointer}.optl input{width:22px;height:22px;flex:none;accent-color:var(--muscle)}
/* ---------- confetti ---------- */
.cf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
</style>

const usedIds=new Set();
const slug=s=>{const b=String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let k=b,n=2;while(usedIds.has(k))k=b+'-'+(n++);usedIds.add(k);return k};
const STOP=new Set(['medial','lateral','greater','lesser','superior','inferior','anterior','posterior','process','surface','major','minor','longus','brevis']);
function mask(text,name){
  const base=name.replace(/\s*\(.*?\)\s*/g,' ').trim();
  const words=[base,...base.split(/\s+/).filter(w=>w.length>4&&!STOP.has(w.toLowerCase()))];
  let t=text;
  for(const w of words){t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'▢▢▢')}
  return t;
}

function options(correct,pref,fallback=[]){const out=[],seen=new Set([String(correct).toLowerCase()]);for(const p of [...shuffle(pref),...shuffle(fallback)]){const k=String(p).toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(p);if(out.length===3)break}return shuffle([correct,...out])}
const NUMS=['1','2','3','4','5','6','7','8','10','12','14','16','24','26','28'];
function makeQ(d,it,focus){
  let q,sub='',ans,opts;
  if(d==='bones'){
    const r=Math.random(),others=bones.filter(b=>b.id!==it.id);
    if(r<.7||!it.count){q='Which bone is this?';sub=mask(it.clue,it.name);ans=it.name;opts=options(ans,others.filter(b=>b.group===it.group).map(b=>b.name),others.map(b=>b.name))}
    else if(r<.85||it.count<=2){q=`The ${it.name.toLowerCase()} belong${it.count===1?'s':''} to which group?`;ans=it.group;opts=options(ans,uniq(bones.map(b=>b.group)))}
    else{q=`How many ${it.name.toLowerCase()} are in the adult skeleton?`;ans=String(it.count);opts=options(ans,NUMS)}
  }else if(d==='terms'){
    const others=terms.filter(t=>t.id!==it.id);
    if(Math.random()<.65){q='Which bone-marking term fits this description?';sub=it.def;ans=it.term;opts=options(ans,others.filter(t=>t.type===it.type).map(t=>t.term),others.map(t=>t.term))}
    else{q=`Which is an example of a ${it.term.toLowerCase()}?`;ans=it.ex;opts=options(ans,others.map(t=>t.ex))}
  }else if(d==='marks'){
    const others=marks.filter(m=>m.id!==it.id);
    const lowName=it.name.toLowerCase();
    const giveaway=[boneBase(it.bone),...((it.bone.match(/\((.*?)\)/)||[])[1]||'').toLowerCase().split(/\s+/).filter(w=>w.length>3)].some(w=>w&&lowName.includes(w));
    if(Math.random()<.5&&!giveaway){q=`The ${it.name} is found on which bone?`;ans=it.bone;opts=options(ans,uniq(marks.map(m=>m.bone)))}
    else{q=`Name this marking on the ${it.bone.replace(/\s*\(.*?\)/,'').toLowerCase()}:`;sub=mask(it.desc,it.name);ans=it.name;opts=options(ans,others.filter(m=>m.bone===it.bone).map(m=>m.name),others.map(m=>m.name))}
  }else{
    const others=muscles.filter(m=>m.id!==it.id),reg=others.filter(m=>m.region===it.region);
    let t=focus;if(!t||t==='mix')t=pick(['who','whoOI','a','n','o','i']);else if(t==='who')t=pick(['who','whoOI']);
    if(t==='who'){q='Which muscle has this action?';sub=it.a;ans=it.name;opts=options(ans,reg.filter(m=>m.a!==it.a).map(m=>m.name),others.filter(m=>m.a!==it.a).map(m=>m.name))}
    else if(t==='whoOI'){q='Which muscle is this?';sub=`Origin: ${it.o}. Insertion: ${it.i}.`;ans=it.name;opts=options(ans,reg.map(m=>m.name),others.map(m=>m.name))}
    else{const F={a:'action',n:'nerve supply',o:'origin',i:'insertion'}[t];q=`What is the ${F} of the ${it.name.toLowerCase()}?`;ans=it[t];opts=options(ans,t==='n'?others.map(m=>m.n):reg.map(m=>m[t]),others.map(m=>m[t]))}
  }
  return {d,id:it.id,q,sub,ans,opts};
}
function buildQs(deck,topic,focus,n,style){
  let pool=deck==='mix'?Object.keys(DECKS).flatMap(d=>DECKS[d].items.map(it=>({d,it}))):itemsFor(deck,topic).map(it=>({d:deck,it}));
  pool=shuffle(pool);const out=[];
  for(let i=0;out.length<n&&pool.length;i++){const {d,it}=pool[i%pool.length];out.push(style==='type'?makeTypedQ(d,it):makeQ(d,it,d==='muscles'?focus:'mix'))}
  return out;
}

function learnList(tab,sub,q){
  const has=(...f)=>!q||f.join(' ').toLowerCase().includes(q);
  let h='';
  if(tab==='bones'){
    const ax=bones.filter(b=>b.region==='Axial').reduce((s,b)=>s+b.count,0),ap=bones.filter(b=>b.region==='Appendicular').reduce((s,b)=>s+b.count,0);
    if(!q)h+=`<div class="tally"><div><b>${ax}</b>axial</div><div class="op">+</div><div><b>${ap}</b>appendicular</div><div class="op">=</div><div class="tot"><b>${ax+ap}</b>bones</div></div>`;
    for(const g of uniq(bones.map(b=>b.group))){
      const items=bones.filter(b=>b.group===g&&has(b.name,b.short,b.clue,b.group));if(!items.length)continue;
      const n=bones.filter(b=>b.group===g).reduce((s,b)=>s+b.count,0);
      h+=`<h2 class="sec">${esc(g)} <span class="pill">${n} bones</span></h2><div class="grid">${items.map(b=>`<div class="card item" style="--accent:var(--bone)">${DECKS.bones.detail(b)}</div>`).join('')}</div>`;
    }
  }else if(tab==='marks'&&sub==='terms'){
    for(const t of uniq(terms.map(t=>t.type))){
      const items=terms.filter(x=>x.type===t&&has(x.term,x.def,x.ex,x.short));if(!items.length)continue;
      h+=`<h2 class="sec">${esc(t)}</h2><div class="grid">${items.map(x=>`<div class="card item" style="--accent:var(--term)">${DECKS.terms.detail(x)}</div>`).join('')}</div>`;
    }
  }else if(tab==='marks'){
    for(const b of uniq(marks.map(m=>m.bone))){
      const items=marks.filter(m=>m.bone===b&&has(m.name,m.desc,m.bone));if(!items.length)continue;
      h+=`<details class="card acc" style="--accent:var(--mark)" ${q?'open':''}><summary><b>${esc(b)} <span class="pill">${items.length}</span></b></summary><ul class="mlist">${items.map(m=>`<li><b>${esc(m.name)}</b>: ${esc(m.desc)}</li>`).join('')}</ul></details>`;
    }
  }else{
    const key=sub==='nerve'?nerveKey:(m=>m.region);
    for(const g of uniq(muscles.map(key))){
      const items=muscles.filter(m=>key(m)===g&&has(m.name,m.o,m.i,m.a,m.n,m.region,m.tip));if(!items.length)continue;
      h+=`<h2 class="sec">${esc(g)} <span class="pill">${items.length}</span></h2><div class="grid">${items.map(m=>`<div class="card item" style="--accent:${sub==='nerve'?'var(--nerve)':'var(--muscle)'}">${DECKS.muscles.detail(m)}</div>`).join('')}</div>`;
    }
  }
  return h||emptyMsg();
}

}

/* ===================== QUIZ ===================== */
let Q=null;
function quiz([sub]){
  const key=e=>{if(location.hash!=='#quiz/run'||!Q||e.target.matches('input,select')||e.target.closest('button'))return;
    if(Q.answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ();return}

    ${P.deck==='muscles'?`<span class="lbl">Question type</span><div class="chips" id="qFocus">${[['mix','🌈 Mixed'],['who','🏷️ Name the muscle'],['a','🏃 Actions'],['n','⚡ Nerves'],['o','📌 Origins'],['i','🎯 Insertions']].map(([k,l])=>`<button class="chip ${k===P.focus?'on':''}" data-v="${k}">${l}</button>`).join('')}</div>`:''}`;
    $('#qTopic').onchange=e=>{P.topic=e.target.value};const f=$('#qFocus');if(f)chipGroup(f,v=>{P.focus=v})};
  chipGroup($('#qDeck'),v=>{P.deck=v;P.topic='all';drawOpts()});

  drawOpts();
  $('#qGo').onclick=()=>{S.qprefs=P;save();const label=(P.deck==='mix'?'Everything mixed':DECKS[P.deck].label)+(P.deck!=='mix'&&P.topic!=='all'?': '+P.topic:'');startQuiz(buildQs(P.deck,P.topic,P.focus,P.n,P.style),label+(P.style==='type'?' (typed)':''))};
}
function startQuiz(qs,label){Q={qs,i:0,score:0,streak:0,best:0,answered:false,missed:[],label};if(location.hash!=='#quiz/run')location.hash='#quiz/run';else go()}
const optsHTML=q=>`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
function drawQ(){

  <div class="bar thin" style="--accent:${D.color}"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>

    <h2>${esc(q.q)}</h2>${q.sub?`<p class="qsub">${esc(q.sub)}</p>`:''}${q.kind==='type'?`<form id="tf" autocomplete="off"><input class="ans" id="ta" placeholder="Type your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><div class="row" style="margin-top:10px"><button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" id="idk">I don't know</button></div></form>`:optsHTML(q)}<div id="fb"></div>

  $$('.opt').forEach(b=>b.onclick=()=>pickOpt(+b.dataset.k));

}
function pickOpt(k){
  if(Q.answered)return;Q.answered=true;const q=Q.qs[Q.i],ok=q.opts[k]===q.ans;grade(q.d,q.id,ok);
  $$('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});

  if(ok){Q.score++;Q.streak++;Q.best=Math.max(Q.best,Q.streak);if(st==='close')Q.close=(Q.close||0)+1}else{Q.streak=0;Q.missed.push(q)}
  const D=DECKS[q.d];
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'miss'}"><b>${st==='ok'?pick(PRAISE):st==='close'?'Right! Check the spelling: '+esc(q.ans):val.trim()?'Not quite. The answer is: '+esc(q.ans):'The answer is: '+esc(q.ans)}</b>${!ok&&val.trim()?`<div class="sm">You typed: ${esc(val)}</div>`:''}</div>

function nextQ(){Q.i++;drawQ();window.scrollTo(0,0)}
function quizDone(){
  const n=Q.qs.length,p=Math.round(Q.score/n*100);
  const msg=p===100?'Perfect score. Your professor should be nervous. 🏆':p>=90?"Outstanding. That's an A! 🌟":p>=80?"Solid! Clean up the misses and you're golden. 💪":p>=70?'Getting there. Review the misses below, then retry them. 📈':'Every miss shows you exactly what to study. Retry them now while they are fresh. 🔁';

  ${Q.missed.length?`<h2 class="sec">Review what you missed</h2><div class="grid">${uniqBy(Q.missed,q=>q.d+q.id).map(q=>`<div class="card item" style="--accent:${DECKS[q.d].color}">${DECKS[q.d].detail(DECKS[q.d].byId[q.id])}</div>`).join('')}</div>`:''}`;
  const r=$('#redo');if(r)r.onclick=()=>{const items=uniqBy(Q.missed,q=>q.d+q.id);startQuiz(shuffle(items).map(q=>q.kind==='type'?makeTypedQ(q.d,DECKS[q.d].byId[q.id]):makeQ(q.d,DECKS[q.d].byId[q.id])),'Retry misses')};

/* ===================== MATCH-UP ===================== */
const MMODES={terms:['🔍','Term and meaning'],bones:['🦴','Bone and nickname'],marks:['📍','Marking and bone'],nerves:['⚡','Muscle and nerve']};
let M=null;
function match([mode]){if(!MMODES[mode])mode=M?M.mode:'terms';newMatch(mode);setClean(()=>{if(M)clearInterval(M.tick)})}
function pairsFor(mode){
  const take=(arr,kf,mf)=>{const seen=new Set(),out=[];for(const x of shuffle(arr)){const k=kf(x);if(seen.has(k))continue;seen.add(k);out.push(mf(x));if(out.length===6)break}return out};
  if(mode==='terms')return take(terms,t=>t.short,t=>[t.term,t.short]);
  if(mode==='bones')return take(bones,b=>b.short,b=>[b.name,b.short]);
  if(mode==='marks')return take(marks,m=>m.bone,m=>[m.name,m.bone]);
  return take(muscles,nerveKey,m=>[m.name,nerveKey(m)]);
}
function newMatch(mode){
  if(M)clearInterval(M.tick);
  const pairs=pairsFor(mode),tiles=shuffle(pairs.flatMap((p,i)=>[{i,s:'L',t:p[0]},{i,s:'R',t:p[1]}]));
  M={mode,tiles,sel:null,found:0,miss:0,start:0,tick:null,lock:false};
  const best=S.best['match_'+mode];
  app.innerHTML=`<h1>🧩 Match-up</h1>
  <div class="chips">${Object.entries(MMODES).map(([k,[e,l]])=>`<a class="chip ${k===mode?'on':''}" href="#match/${k}">${e} ${l}</a>`).join('')}</div>
  <div class="row sb hud" style="margin-bottom:12px"><span>⏱️ <b id="mt">0.0</b>s</span><span>Pairs <b id="mf">0</b>/6</span><span class="sm">Best: <b>${best?best.toFixed(1)+'s':'none yet'}</b></span></div>
  <div class="mgrid">${tiles.map((t,k)=>`<button class="mt ${t.s}" data-k="${k}">${esc(t.t)}</button>`).join('')}</div>
  <p class="sm muted center">Tap a card, then its partner. Blue cards are the names.</p>
  <div class="row center"><button class="btn" id="mNew">🔀 New board</button></div>`;
  $('#mNew').onclick=()=>newMatch(mode);
  $$('.mt').forEach(b=>b.onclick=()=>tapTile(+b.dataset.k,b));
}
function tapTile(k,el){
  if(M.lock||el.classList.contains('done'))return;
  if(!M.start){M.start=Date.now();M.tick=setInterval(()=>{const e=$('#mt');if(e)e.textContent=((Date.now()-M.start)/1000).toFixed(1)},100)}
  const t=M.tiles[k];
  if(M.sel===null){M.sel=k;el.classList.add('sel');return}
  if(M.sel===k){M.sel=null;el.classList.remove('sel');return}
  const a=M.tiles[M.sel],ael=$(`.mt[data-k="${M.sel}"]`);
  if(a.s===t.s){ael.classList.remove('sel');M.sel=k;el.classList.add('sel');return}
  if(a.i===t.i){ael.classList.remove('sel');ael.classList.add('done');el.classList.add('done');ael.disabled=el.disabled=true;M.sel=null;M.found++;$('#mf').textContent=M.found;S.stats.xp+=5;if(M.found===6)matchWin()}
  else{M.miss++;M.lock=true;ael.classList.add('shake');el.classList.add('shake','sel');setTimeout(()=>{ael.classList.remove('shake','sel');el.classList.remove('shake','sel');M.sel=null;M.lock=false},450)}
}
function matchWin(){
  clearInterval(M.tick);const t=(Date.now()-M.start)/1000,key='match_'+M.mode,prev=S.best[key],rec=!prev||t<prev;
  if(rec)S.best[key]=t;touch();save();confetti();
  const box=document.createElement('div');box.className='card done';
  box.innerHTML=`<div class="huge">${rec?'🏆':'🎉'}</div><h2>${t.toFixed(1)} seconds${rec?', a new record!':''}</h2><p>${M.miss} mismatch${M.miss===1?'':'es'}</p><div class="row center"><button class="btn primary" id="mAgain">Play again</button><a class="btn" href="#games">More games</a></div>`;
  $('.mgrid').replaceWith(box);$('#mAgain').onclick=()=>newMatch(M.mode);
}

/* ===================== BONE BLITZ ===================== */
let B=null;
function blitz(){
  const best=S.best.blitz||0;
  app.innerHTML=`<h1>⏱️ Bone Blitz</h1><div class="card setup center"><p class="lead">60 seconds of rapid-fire questions. Every 3 right in a row bumps your multiplier, up to ×4.</p><p>Your best: <b class="score">${best}</b></p>
  <span class="lbl">Question pool</span><div class="chips center" id="bDeck">${[['mix','🌈 Everything'],...Object.entries(DECKS).map(([k,d])=>[k,d.emoji+' '+d.label])].map(([k,l],i)=>`<button class="chip ${i===0?'on':''}" data-v="${k}">${l}</button>`).join('')}</div>

function runBlitz(deck){
  B={deck,score:0,combo:0,ok:0,bad:0,end:Date.now()+60000,missed:[],lock:false,q:null,tick:null};
  app.innerHTML=`<div class="row sb hud"><span class="score">⭐ <b id="bS">0</b></span><span id="bC" class="combo"></span><span class="timer"><b id="bT">60</b>s</span></div><div class="bar thin timebar"><i id="bBar" style="width:100%"></i></div><div id="bQ"></div>`;
  B.tick=setInterval(()=>{if(!B)return;const left=Math.max(0,B.end-Date.now()),t=$('#bT');if(!t)return;t.textContent=Math.ceil(left/1000);$('#bBar').style.width=(left/600)+'%';if(left<=0)blitzDone()},100);
  nextBlitz();
}
function nextBlitz(){
  if(!B||!$('#bQ'))return;const d=B.deck==='mix'?pick(Object.keys(DECKS)):B.deck;const q=B.q=makeQ(d,pick(DECKS[d].items));const D=DECKS[q.d];B.lock=false;
  $('#bQ').innerHTML=`<div class="card qcard" style="--accent:${D.color}"><div class="sm muted">${D.emoji} ${D.label}</div><h2>${esc(q.q)}</h2>${q.sub?`<p class="qsub">${esc(q.sub)}</p>`:''}${optsHTML(q)}</div>`;
  $$('#bQ .opt').forEach(b=>b.onclick=()=>blitzPick(+b.dataset.k));
}
function blitzPick(k){
  if(!B||B.lock)return;B.lock=true;const q=B.q,ok=q.opts[k]===q.ans;grade(q.d,q.id,ok);
  $$('#bQ .opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});
  if(ok){B.combo++;B.ok++;B.score+=10*Math.min(4,1+Math.floor((B.combo-1)/3))}else{B.combo=0;B.bad++;B.missed.push(q)}
  const m=Math.min(4,1+Math.floor(B.combo/3));$('#bS').textContent=B.score;$('#bC').textContent=m>1?`🔥 ×${m}`:'';
  setTimeout(nextBlitz,ok?350:1100);

function blitzDone(){
  if(!B)return;clearInterval(B.tick);const b=B;B=null;const prev=S.best.blitz||0,rec=b.score>prev;
  if(rec){S.best.blitz=b.score;save();confetti()}
  const missed=uniqBy(b.missed,q=>q.d+q.id);
  app.innerHTML=`<div class="card done"><div class="huge">${rec?'🏆':'⏱️'}</div><h1>${b.score} points</h1><p class="lead">${rec?'New personal record!':'Best so far: '+prev}</p><p>✅ ${b.ok} correct, ❌ ${b.bad} missed</p><div class="row center"><button class="btn primary" id="bAgain">Go again</button><a class="btn" href="#weak">Drill weak spots</a></div></div>
  ${missed.length?`<h2 class="sec">What you missed</h2><div class="grid">${missed.map(q=>`<div class="card item" style="--accent:${DECKS[q.d].color}"><div class="sm muted">${esc(q.q)}</div>${q.sub?`<p class="sm">${esc(q.sub)}</p>`:''}<p><b>Answer:</b> ${esc(q.ans)}</p></div>`).join('')}</div>`:''}`;
  $('#bAgain').onclick=()=>runBlitz(b.deck);
}

/* ===================== WEAK SPOTS ===================== */
function weak(){
  const list=Object.entries(S.missed).map(([k,n])=>{const i=k.indexOf(':'),d=k.slice(0,i),id=k.slice(i+1);const it=DECKS[d]&&DECKS[d].byId[id];return it?{d,it,n}:null}).filter(Boolean).sort((a,b)=>b.n-a.n);
  app.innerHTML=`<h1>🎯 Weak spots</h1><p class="lead">Everything you miss lands here. Answer it right and it drops off the list.</p>

    s+=`<ellipse class="decor" cx="${f(129)}" cy="357" rx="5" ry="8"/>`;
  }
  s+=shape('path','sacrum','d="M137 306 L163 306 L156 346 L144 346 Z"');

    s+=ln('tibia',f(137),496,f(139),600,11);
    s+=shape('ellipse','tarsals',`cx="${f(131)}" cy="612" rx="14" ry="8"`);
    s+=hit('metatarsals',f,108,150,619,23);s+=hit('phalangesF',f,106,152,642,18);

const ALT={
 'fibularis longus':['peroneus longus'],'fibularis brevis':['peroneus brevis'],
 'intertubercular sulcus':['bicipital groove','intertubercular groove'],'groove (sulcus)':['sulcus'],
 'os coxae (hip bone)':['hip bone','coxal bone','innominate bone','os coxae','pelvic bone'],
 'olecranon':['olecranon process'],'acromion':['acromion process'],'glenoid cavity':['glenoid fossa'],
 'external acoustic meatus':['external auditory meatus'],'internal acoustic meatus':['internal auditory meatus'],
 'tensor fasciae latae':['tensor fascia latae','tensor fascia lata'],'clavicle':['collarbone'],'scapula':['shoulder blade'],
 'patella':['kneecap'],'sternum':['breastbone'],'coccyx':['tailbone'],'calcaneus':['heel bone'],'mandible':['lower jaw'],
 'maxilla':['upper jaw'],'erector spinae':['sacrospinalis'],'trochlea':['trochlea of humerus'],
};
function altsFor(name){
  const out=[name];const m=String(name).match(/^(.*?)\s*\((.*?)\)\s*(.*)$/);
  if(m){const [,a,b,c]=m;if(c){out.push(a+' '+c,b+' '+c)}else{out.push(a);if(/\s/.test(b))out.push(b)}}
  const x=ALT[String(name).toLowerCase()];if(x)out.push(...x);return out;
}
const FILLER=new Set(['the','of','a','an','bone','bones','muscle','muscles','nerve','nerves','m','n']);
const sing=w=>w.length>3&&w.endsWith('s')&&!/(ss|is|us)$/.test(w)?w.slice(0,-1):w;
function akey(s,ctx){return String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(t=>t&&!FILLER.has(t)&&!ctx.has(t)).map(sing).sort().join(' ')}
const CONTRAST=new Set(['major','minor','medial','lateral','superior','inferior','anterior','posterior','greater','lesser','longus','brevis','internal','external','maximus','medius','minimus','superficialis','profundus','proximal','distal','upper','lower','intermedius','magnus']);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkAns(input,answers,ctx=[]){
  const c=new Set(ctx.map(x=>x.toLowerCase()));const ik=akey(input,c);if(!ik)return 'miss';
  let close=false;const it=new Set(ik.split(' '));
  for(const a of answers){const ak=akey(a,c);if(!ak)continue;if(ak===ik)return 'ok';
    const at=new Set(ak.split(' '));if([...it].some(t=>!at.has(t)&&CONTRAST.has(t)))continue;
    const allow=ak.length<=4?0:ak.length<=8?1:Math.max(1,Math.floor(ak.length*.15));if(lev(ik,ak)<=allow)close=true}
  return close?'close':'miss';
}
function makeTypedQ(d,it){
  let q,sub;
  if(d==='bones'){q='Name this bone';sub=mask(it.clue,it.name)}
  else if(d==='terms'){q='Name this bone-marking term';sub=it.def}
  else if(d==='marks'){q=`Name this marking on the ${it.bone.replace(/\s*\(.*?\)/,'').toLowerCase()}`;sub=mask(it.desc,it.name)}
  else{if(Math.random()<.5){q='Name the muscle with this action';sub=it.a}else{q='Name this muscle';sub=`Origin: ${it.o}. Insertion: ${it.i}.`}}
  const name=d==='terms'?it.term:it.name;
  return {d,id:it.id,q,sub,kind:'type',ans:name,answers:altsFor(name)};
}
const nerveAnswers=m=>{const base=altsFor(m.n.replace(/\s*\((?!CN)[^)]*\)/g,'').trim());base.push(nerveKey(m));if(m.name==='Pectoralis major')base.push('pectoral nerves','medial pectoral','lateral pectoral');return base};
const findItem=(d,name)=>d&&name?DECKS[d].items.find(i=>DECKS[d].title(i).toLowerCase()===String(name).toLowerCase()):null;
function findRefByName(name){for(const d of Object.keys(DECKS)){const it=DECKS[d].items.find(i=>altsFor(DECKS[d].title(i)).some(a=>akey(a,new Set())===akey(name,new Set())));if(it)return {d,id:it.id}}return null}

    <p class="lead" style="margin-top:0">One pinned structure per station. Type the name, no choices given. The clock keeps moving and there's no going back.</p>
    <span class="lbl">Pull stations from</span>
    <div class="opts">${tog('s_bone',C.src.bone,'Bone diagrams',cnt('bone')+' pins: humerus, femur, scapula, hip bone, skull, vertebra')}${tog('s_muscle',C.src.muscle,'Muscle maps',cnt('muscle')+' pins: superficial muscles, front and back')}${tog('s_skel',C.src.skel,'Full skeleton',cnt('skel')+' pins: whole bones')}${tog('s_mine',C.src.mine,'My images',mineN?mineN+' pins you added':'None yet. Add some under My images.')}</div>
    <span class="lbl">Stations</span><div class="chips" id="pN">${[10,20,30,40].map(n=>`<button class="chip ${n===C.n?'on':''}" data-v="${n}">${n}</button>`).join('')}</div>
    <span class="lbl">Seconds per station</span><div class="chips" id="pS">${[30,45,60,90].map(n=>`<button class="chip ${n===C.sec?'on':''}" data-v="${n}">${n}s</button>`).join('')}</div>
    <span class="lbl">Options</span>
    <div class="opts">${tog('o_fu',C.fu,'Follow-up questions','Name the nerve for pinned muscles, plus any follow-ups you wrote on your own images')}${tog('o_strict',C.strict,'Strict spelling','Close-but-misspelled answers count as wrong, like a picky grader')}${tog('o_fb',C.fb==='each','Show answers after each station','Off is more realistic: you see everything at the end')}</div>
    <button class="btn primary big" id="pGo">Start the practical ⏱️</button><p class="sm muted center" id="pErr"></p>
  </div>`;
  chipGroup($('#pN'),v=>{C.n=+v});chipGroup($('#pS'),v=>{C.sec=+v});
  $('#pGo').onclick=()=>{C.src={bone:$('#s_bone').checked,muscle:$('#s_muscle').checked,skel:$('#s_skel').checked,mine:$('#s_mine').checked};C.fu=$('#o_fu').checked;C.strict=$('#o_strict').checked;C.fb=$('#o_fb').checked?'each':'end';S.prefsPR=C;save();
    if(!prStart(C))$('#pErr').textContent='Pick at least one source that has pins.'};
}
function drawStation(){
  if(PR.tick)clearInterval(PR.tick);
  if(PR.i>=PR.st.length){location.hash='#lab/results';return}
  const s=PR.st[PR.i],sec=PR.cfg.sec;PR.waiting=false;
  app.innerHTML=`<div class="row sb hud"><span class="score">Station ${PR.i+1} of ${PR.st.length}</span><span class="timer"><b id="pT">${sec}</b>s</span></div>
  <div class="bar thin timebar"><i id="pBar" style="width:100%"></i></div>
  <div class="station"><div>${stage(s.st,[{x:s.pin.x,y:s.pin.y,cls:'active'}])}<div class="sm muted center" style="margin-top:6px">${esc(s.title)}</div></div>
  <form class="card" id="sf" autocomplete="off">${s.parts.map((p,k)=>`<label class="lbl" for="a${k}" ${k?'':'style="margin-top:0"'}>${k+1}. ${esc(p.q)}</label><input class="ans" id="a${k}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${k<s.parts.length-1?'next':'done'}">`).join('')}
  <div id="sfb"></div><button class="btn primary big" type="submit" id="sBtn">${PR.i+1<PR.st.length?'Next station':'Finish'}</button>
  <div class="row sb sm muted" style="margin-top:8px"><span>No going back, just like the real thing.</span><button type="button" class="linkbtn" id="pQuit">End early</button></div></form></div>`;
  const ins=$$('.ans');ins.forEach((el,k)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&k<ins.length-1){e.preventDefault();ins[k+1].focus()}}));
  if(window.innerWidth>=820)ins[0].focus({preventScroll:true});
  $('#pQuit').onclick=()=>{if(confirm('End the practical now? Unanswered stations count as misses.')){while(PR.res.length<PR.st.length)recordStation(PR.st[PR.res.length],[]);PR.i=PR.st.length;clearInterval(PR.tick);location.hash='#lab/results'}};
  const end=Date.now()+sec*1000;
  PR.tick=setInterval(()=>{const left=Math.max(0,end-Date.now()),t=$('#pT');if(!t)return;t.textContent=Math.ceil(left/1000);$('#pBar').style.width=(left/(sec*10))+'%';if(left<=0)submitStation()},100);
  $('#sf').onsubmit=e=>{e.preventDefault();if(PR.waiting){PR.i++;drawStation();window.scrollTo(0,0)}else submitStation()};
}
function recordStation(s,vals){
  const st=s.parts.map((p,k)=>checkAns(vals[k]||'',p.answers,p.ctx));
  s.parts.forEach((p,k)=>{if(p.ref)grade(p.ref.d,p.ref.id,st[k]==='ok'||(st[k]==='close'&&!PR.cfg.strict))});
  PR.res.push({vals,st});return st;
}
function submitStation(){
  if(!PR||PR.waiting||PR.res.length>PR.i)return;clearInterval(PR.tick);
  const s=PR.st[PR.i],vals=$$('.ans').map(i=>i.value.trim());const st=recordStation(s,vals);
  if(PR.cfg.fb==='each'){PR.waiting=true;$$('.ans').forEach(i=>i.disabled=true);
    $('#sfb').innerHTML=`<div class="fb ${st.every(x=>x==='ok')?'good':'miss'}">${s.parts.map((p,k)=>`<div>${statusIcon(st[k])} ${esc(p.display)}${st[k]==='close'?' <span class="sm">(check your spelling)</span>':''}</div>`).join('')}</div>`;
    $('#sBtn').textContent=PR.i+1<PR.st.length?'Next station':'See results';$('#sBtn').focus({preventScroll:true});
  }else{PR.i++;drawStation();window.scrollTo(0,0)}
}
function prResults(){
  if(PR.tick)clearInterval(PR.tick);
  const strict=PR.cfg.strict;let pts=0,tot=0,close=0;
  PR.res.forEach(r=>r.st.forEach(s=>{tot++;if(s==='ok')pts++;else if(s==='close'){close++;if(!strict)pts++}}));
  const p=tot?Math.round(pts/tot*100):0;if(p>=80)confetti();
  const missedIdx=PR.res.map((r,i)=>r.st.some(s=>s==='miss'||(strict&&s==='close'))?i:-1).filter(i=>i>=0);
  app.innerHTML=`<div class="card done"><div class="huge">${p>=90?'🏆':p>=70?'🎉':'💪'}</div><h1>${pts} / ${tot}</h1><div class="bigpct">${p}%</div>
  <p>${p>=90?'That would be an A on the practical.':p>=80?'Strong. Fix the misses below and run it again.':p>=70?'Getting there. Study the misses, then retry just those.':'Each miss below is a structure to learn. Retry them now while they are fresh.'}</p>
  ${close?`<p class="sm">${close} answer${close===1?' was':'s were'} right but misspelled${strict?' and counted wrong (strict spelling)':''}.</p>`:''}
  <div class="row center">${missedIdx.length?`<button class="btn primary" id="rMiss">🔁 Retry my ${missedIdx.length} missed station${missedIdx.length===1?'':'s'}</button>`:''}<a class="btn" href="#lab">New practical</a></div></div>
  <h2 class="sec">Station by station</h2>
  <div class="thumbgrid">${PR.res.map((r,i)=>{const s=PR.st[i];return `<div class="card item" style="--accent:${r.st.every(x=>x==='ok')?'var(--good)':r.st.some(x=>x==='miss')?'var(--bad)':'var(--bone)'}"><div class="sm muted">Station ${i+1}</div>${stage(s.st,[{x:s.pin.x,y:s.pin.y,cls:'active still'}])}
    <div class="res">${s.parts.map((p,k)=>`${statusIcon(r.st[k])}<div><b>${esc(p.display)}</b>${r.st[k]!=='ok'?`<br><span class="sm muted">You: ${esc(r.vals[k]||'(blank)')}</span>`:''}</div>`).join('')}</div></div>`}).join('')}</div>`;
  const b=$('#rMiss');if(b)b.onclick=()=>{PR={...PR,st:shuffle(missedIdx.map(i=>PR.st[i])),i:0,res:[],tick:null,waiting:false};location.hash='#lab/run'};
}

/* ===================== DIAGRAM EXPLORER ===================== */
function diagramList(){
  app.innerHTML=`<h1>🖼️ Diagrams</h1>${labTabs('diagrams')}<p class="lead">Learn the pins here first, then test yourself in Practical mode.</p>
  <div class="thumbgrid">${allDiagrams().map(D=>`<a class="card item" href="#lab/diagrams/${D.id}" style="--accent:${D.kind==='muscle'?'var(--muscle)':'var(--bone)'};text-decoration:none">${stage({svg:D.svg(),w:D.w,h:D.h,cls:D.cls},[])}<h3 style="margin-top:10px">${esc(D.title)}</h3><div class="sm muted">${D.pins.length} pins</div></a>`).join('')}</div>`;
}
function diagramView(id){
  const D=allDiagrams().find(d=>d.id===id);if(!D)return diagramList();
  const pins=dgPins(D),shown=new Set();
  const draw=()=>{$('#dstage').innerHTML=stage({svg:D.svg(),w:D.w,h:D.h,cls:D.cls},pins.map((p,k)=>({x:p.x,y:p.y,n:k+1,label:shown.has(k)?p.a:'',cls:shown.has(k)?'sel':''})));
    $('#dlist').innerHTML=pins.map((p,k)=>`<li><button class="linkbtn rv" data-k="${k}" style="text-decoration:none;color:inherit"><b>${k+1}.</b> ${shown.has(k)?esc(p.a):'<span class="muted">tap to reveal</span>'}</button></li>`).join('')};
  app.innerHTML=`<a class="btn sm ghost" href="#lab/diagrams">← All diagrams</a><h1>${esc(D.title)}</h1><p class="muted">${esc(D.sub)}</p>
  <div class="station"><div id="dstage"></div><div class="card"><div class="row"><button class="btn sm" id="dAll">Show all</button><button class="btn sm" id="dNone">Hide all</button><button class="btn sm primary" id="dQuiz">Quiz me on this one</button></div><ol class="mlist" id="dlist" style="list-style:none;padding:0"></ol><p class="sm muted">Tap a pin or a number to reveal its name. Try to say it out loud first.</p></div></div>`;
  const tgl=k=>{shown.has(k)?shown.delete(k):shown.add(k);draw()};
  $('#dstage').addEventListener('click',e=>{const b=e.target.closest('.pin');if(b)tgl(+b.dataset.k)});
  $('#dlist').addEventListener('click',e=>{const b=e.target.closest('.rv');if(b)tgl(+b.dataset.k)});
  $('#dAll').onclick=()=>{pins.forEach((_,k)=>shown.add(k));draw()};$('#dNone').onclick=()=>{shown.clear();draw()};
  $('#dQuiz').onclick=()=>prStart({...PDEF,n:99,sec:60,fb:'each',fu:false},D.id);
  draw();
}

/* ===================== MY IMAGES: PIN BUILDER ===================== */
function mineList(){
  app.innerHTML=`<h1>➕ My images</h1>${labTabs('mine')}
  <div class="card"><p class="lead" style="margin-top:0">Turn any anatomy picture into practical stations.</p>
  <p>Use figures from your textbook, lab manual, lecture slides, or an anatomy app. A phone photo of a textbook page or a screenshot works great. Drop pins on the structures you need to know and type their names.</p>
  <div class="row"><label class="btn primary">📷 Add images<input type="file" id="fIn" accept="image/*" multiple hidden></label><span class="sm muted">On a computer you can also paste a screenshot here (Ctrl/Cmd + V).</span></div>
  <p class="sm muted">Images stay private on this device and this browser.</p>
  ${IDB_OK?'':'<p class="badtxt">This browser is blocking storage, so images can\'t be saved here.</p>'}</div>
  <div class="thumbgrid sec" id="mlist">${MINE.length?MINE.map(im=>`<div class="card item" style="--accent:var(--term)">${stage(im,im.pins.map(p=>({x:p.x,y:p.y,cls:'dot'})))}<h3 style="margin-top:10px">${esc(im.title)}</h3><div class="sm muted">${im.pins.length} pin${im.pins.length===1?'':'s'}</div><div class="row" style="margin-top:8px"><a class="btn sm primary" href="#lab/mine/${im.id}">Edit pins</a><button class="btn sm ghost" data-del="${im.id}">Delete</button></div></div>`).join(''):'<div class="card empty"><div class="huge">🖼️</div><p>No images yet. Add your first one above.</p></div>'}</div>
  ${MINE.length?`<div class="row sec"><button class="btn sm" id="exp">⬇️ Back up all (file)</button><label class="btn sm">⬆️ Restore from backup<input type="file" id="imp" accept=".json,application/json" hidden></label><span class="sm muted">Handy for sharing a set with a study partner.</span></div>`:`<div class="row sec"><label class="btn sm">⬆️ Restore from backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div>`}`;
  const add=async files=>{let last=null;for(const f of files){if(!f.type.startsWith('image/'))continue;try{const im=await fileToImg(f);MINE.push(im);await saveImg(im);last=im}catch(e){}}if(last)location.hash='#lab/mine/'+last.id};
  $('#fIn').onchange=e=>add([...e.target.files]);
  document.onpaste=e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(fs.length)add(fs)};
  $('#mlist').addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b||!confirm('Delete this image and its pins?'))return;MINE=MINE.filter(i=>i.id!==b.dataset.del);await IDB.del(b.dataset.del).catch(()=>{});mineList()});
  const ex=$('#exp');if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify({app:'boneup',v:1,images:MINE})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bone-up-images.json';document.body.appendChild(a);a.click();a.remove()};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const im of (data.images||[])){if(!im.src||!im.w)continue;if(MINE.some(m=>m.id===im.id))im.id=uid();MINE.push(im);await saveImg(im)}mineList()}catch(err){alert('That file is not a Bone Up backup.')}};
}
function editImg(id){
  const im=MINE.find(i=>i.id===id);if(!im)return mineList();
  let sel=null,moving=false;
  const persist=()=>saveImg(im);
  const draw=()=>{
    $('#estage').innerHTML=stage(im,im.pins.map((p,k)=>({x:p.x,y:p.y,n:k+1,cls:k===sel?'sel':''})),'id="eimg"');
    const p=sel!==null?im.pins[sel]:null;
    $('#pform').innerHTML=p?`<div class="row sb"><b>Pin ${sel+1}</b><span><button type="button" class="btn sm" id="pMove">${moving?'Tap the new spot…':'Move'}</button> <button type="button" class="btn sm ghost" id="pDel">Delete</button></span></div>
      <label class="lbl">What is it?</label><input class="ans" id="pA" value="${esc(p.a)}" placeholder="e.g. Greater tubercle">
      <label class="lbl">Also accept <span class="sm muted">(optional, separate with commas)</span></label><input class="ans" id="pAlt" value="${esc((p.alts||[]).join(', '))}" placeholder="e.g. greater tuberosity">
      <label class="lbl">Follow-up question <span class="sm muted">(optional)</span></label><input class="ans" id="pFq" value="${esc(p.fq||'')}" placeholder="e.g. What muscle inserts here?">
      <label class="lbl">Follow-up answer</label><input class="ans" id="pFa" value="${esc(p.fa||'')}" placeholder="e.g. Supraspinatus">`
      :`<p class="lead" style="margin-top:0">Tap the image to drop a pin.</p><p class="sm muted">Then type what it points to. Add as many pins as you like.</p>`;
    $('#plist').innerHTML=im.pins.map((p,k)=>`<li><button class="linkbtn sp" data-k="${k}" style="text-decoration:none;color:inherit"><b>${k+1}.</b> ${p.a?esc(p.a):'<span class="badtxt">needs a name</span>'}</button></li>`).join('');
    if(p){const bind=(id,f)=>{$(id).addEventListener('input',e=>{f(e.target.value);clearTimeout(editImg.t);editImg.t=setTimeout(()=>{persist();const li=$(`.sp[data-k="${sel}"]`);if(li)li.innerHTML=`<b>${sel+1}.</b> ${p.a?esc(p.a):'<span class="badtxt">needs a name</span>'}`},300)})};
      bind('#pA',v=>p.a=v.trim());bind('#pAlt',v=>p.alts=v.split(',').map(s=>s.trim()).filter(Boolean));bind('#pFq',v=>p.fq=v.trim());bind('#pFa',v=>p.fa=v.trim());
      $('#pDel').onclick=()=>{im.pins.splice(sel,1);sel=null;moving=false;persist();draw()};$('#pMove').onclick=()=>{moving=!moving;draw()}}
  };
  app.innerHTML=`<a class="btn sm ghost" href="#lab/mine">← My images</a>
  <input class="ans" id="tIn" value="${esc(im.title)}" aria-label="Image title" style="margin:10px 0;font-family:Fredoka,sans-serif;font-size:1.3rem">
  <div class="station"><div id="estage"></div><div><div class="card" id="pform"></div><div class="card" style="margin-top:12px"><b>Pins</b><ol class="mlist" id="plist" style="list-style:none;padding:0"></ol>${im.pins.length?'':''}<a class="btn sm" href="#lab">Practice these in Practical mode</a></div></div></div>`;
  $('#tIn').addEventListener('input',e=>{im.title=e.target.value;clearTimeout(editImg.t2);editImg.t2=setTimeout(persist,400)});
  $('#estage').addEventListener('click',e=>{
    const pinEl=e.target.closest('.pin');
    if(pinEl&&!moving){sel=+pinEl.dataset.k;draw();return}
    const box=$('#eimg').getBoundingClientRect();const x=(e.clientX-box.left)/box.width,y=(e.clientY-box.top)/box.height;if(x<0||x>1||y<0||y>1)return;
    if(moving&&sel!==null){im.pins[sel].x=x;im.pins[sel].y=y;moving=false}
    else{im.pins.push({x,y,a:'',alts:[]});sel=im.pins.length-1}
    persist();draw();const a=$('#pA');if(a)a.focus({preventScroll:window.innerWidth<820})});
  $('#plist').addEventListener('click',e=>{const b=e.target.closest('.sp');if(b){sel=+b.dataset.k;moving=false;draw()}});
  draw();
}

/* ===================== THEME + BOOT ===================== */
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
$('#themeBtn').onclick=()=>{const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;const cur=S.theme||(sysDark?'dark':'light');S.theme=cur==='dark'?'light':'dark';save();applyTheme()};
applyTheme();loadMine().then(go,go);
})();
